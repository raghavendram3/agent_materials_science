[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-materials-science"
version = "0.2.2"
description = "A Python agent for automated materials science workflows, focusing on surface adsorption analysis"
readme = "README.md"
authors = [
    { name = "Raghavendra Meena", email = "raghavendra.ip2020@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
# fairchem-core 2.x requires Python >=3.11,<3.14 and torch ~=2.8
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["materials-science", "computational-chemistry", "adsorption", "DFT", "machine-learning"]

dependencies = [
    "mp-api>=0.45",
    "pymatgen>=2024.11.13",
    "ase>=3.26.0",
    "numpy>=2.0,<2.5",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# ML energy calculations (pulls in torch ~=2.8; large download).
# UMA checkpoints are gated on Hugging Face: request access to facebook/UMA
# and run `huggingface-cli login` once.
ml = [
    "fairchem-core>=2.21.0",
]
# AdsorbML-style production adsorption-energy workflows.
adsorbml = [
    "fairchem-core[adsorbml]>=2.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/raghavendram3/agent_materials_science"
Repository = "https://github.com/raghavendram3/agent_materials_science"
Issues = "https://github.com/raghavendram3/agent_materials_science/issues"

[project.scripts]
agent-materials-science = "agent_materials_science.cli:main"

[tool.setuptools]
packages = ["agent_materials_science", "agent_materials_science.core", "agent_materials_science.tools"]

[tool.setuptools.package-data]
agent_materials_science = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
